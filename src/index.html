<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KRA iTax</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Font loads — subset to Latin for Kenya -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap&subset=latin" rel="stylesheet">

  <!-- Theme flash prevention — must be before Angular bootstrap -->
  <script>
    (function() {
      var t = localStorage.getItem('kra_theme') ||
              (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Meta theme-color — browser chrome adapts -->
  <meta name="theme-color" content="#000000" id="theme-meta">
</head>
<body>
  <app-root></app-root>
</body>
</html>
